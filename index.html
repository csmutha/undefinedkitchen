<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undefined Kitchen</title>
<meta name="description" content="Undefined Kitchen — home cooking, undefined. Launching soon in Hyderabad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0F3D37; --yolk:#F5B82E; --shell:#F4EEDF; --shell-dim:rgba(244,238,223,.68);
    --sage:#7FA79C; --rule:rgba(127,167,156,.35);
    --display:"Bricolage Grotesque","Arial Black",Impact,sans-serif;
    --body:"DM Sans","Helvetica Neue",Arial,sans-serif;
    --mono:"DM Mono","SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--ground);color:var(--shell);
    font-family:var(--body);font-size:17px;line-height:1.55;
    background-image:radial-gradient(ellipse 70% 55% at 85% 15%, rgba(245,184,46,.13), transparent 65%);}
  .wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 28px}
  header{display:flex;align-items:center;justify-content:space-between;padding:26px 0;border-bottom:1px solid var(--rule)}
  .mark{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
  .mark span{color:var(--yolk)}
  .tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
  .tag b{color:var(--yolk);font-weight:500}
  main{flex:1;display:flex;align-items:center}
  .hero{padding:80px 0}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(52px,9vw,124px);line-height:.94;letter-spacing:-.03em;margin:0 0 28px;text-wrap:balance;max-width:11ch}
  h1 em{font-style:normal;color:var(--yolk)}
  .lede{font-size:clamp(18px,1.7vw,22px);max-width:32em;color:var(--shell-dim);margin:0 0 36px}
  .soon{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--shell);
    border:1px solid var(--rule);border-radius:999px;padding:12px 18px}
  .soon i{width:8px;height:8px;border-radius:50%;background:var(--yolk);box-shadow:0 0 0 4px rgba(245,184,46,.18)}
  footer{border-top:1px solid var(--rule);padding:28px 0 40px;font-size:14px;color:var(--sage);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .social{display:flex;gap:18px}
  .social a{color:var(--shell);text-decoration:none;display:inline-flex;align-items:center;gap:7px}
  .social a:hover{color:var(--yolk)}
  .social svg{width:18px;height:18px;fill:currentColor}
  @media (max-width:640px){
    .wrap{padding:0 22px}
    header{padding:20px 0}
    .tag{display:none}
    main{align-items:flex-start}
    .hero{padding:44px 0 40px}
    h1{font-size:clamp(44px,13vw,60px);line-height:.98;margin-bottom:20px;max-width:none}
    .lede{font-size:17px;margin-bottom:28px}
    .soon{font-size:12px;letter-spacing:.1em;padding:11px 16px;white-space:nowrap}
    footer{padding:22px 0 32px;font-size:13px;flex-direction:column;align-items:flex-start;gap:12px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="mark">Undefined<span>Kitchen</span></div>
    <div class="tag">Hyderabad · <b>Launching soon</b></div>
  </header>
</div>

<main>
  <div class="wrap">
    <section class="hero">
      <h1>Home cooking, un<em>defined</em>.</h1>
      <p class="lede">Real ingredients, sealed fresh, ready in minutes. We're putting the finishing touches on our first range.</p>
      <div class="soon"><i></i>Launching soon in Hyderabad</div>
    </section>
  </div>
</main>

<div class="wrap">
  <footer>
    <div>© 2026 Undefined Kitchen · Hyderabad, India</div>

    </nav>
  </footer>
</div>

</body>
</html>
